[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-charter"
version = "0.1.0"
description = "Declarative deliverable contracts for AI agent runs: instruct, gate, and audit what a long-horizon agent must produce."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "agent-charter contributors" }]
keywords = ["agents", "llm", "governance", "ci", "contracts", "deliverables", "claude-code"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/zhenthebuilder/agent-charter"
Issues = "https://github.com/zhenthebuilder/agent-charter/issues"

[project.scripts]
charter = "charter:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
py-modules = ["charter"]
